apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "website-stack.fullname" . }}-api-config
data:
  NODE_ENV: production
  APP_PORT: "{{ .Values.api.port }}"
  REDIS_ENABLED: "true"
  SWAGGER_ENABLED: "false"
  OTEL_ENABLED: "{{ .Values.observability.otelEnabled }}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .Values.observability.otelEndpoint }}"
  OTEL_SERVICE_NAME: website-api
