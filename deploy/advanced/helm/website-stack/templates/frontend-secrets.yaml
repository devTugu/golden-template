{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "website-stack.fullname" . }}-frontend-secrets
type: Opaque
stringData:
  NODE_ENV: production
  NEXT_SERVER_MODE: prod
  API_INTERNAL_URL: "http://{{ include "website-stack.fullname" . }}-api:{{ .Values.api.port }}/api/v1"
  NEXT_PUBLIC_APP_NAME: "{{ .Values.brand.nextPublicAppName }}"
  NEXT_PUBLIC_BRAND_NAME: "{{ .Values.brand.nextPublicBrandName }}"
  NEXT_PUBLIC_SITE_URL: "{{ .Values.brand.nextPublicSiteUrl }}"
  # Optional — override before production deploy
  # SENTRY_DSN: ""
  # OTEL_ENABLED: "false"
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
  # OTEL_SERVICE_NAME: website-frontend
{{- end }}
