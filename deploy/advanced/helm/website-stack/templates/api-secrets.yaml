{{- if .Values.api.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "website-stack.fullname" . }}-api-secrets
type: Opaque
stringData:
  DB_HOST: "{{ .Values.postgres.host | default "postgres" }}"
  DB_PORT: "{{ .Values.postgres.port | default "5432" }}"
  DB_USERNAME: "{{ .Values.postgres.auth.username }}"
  DB_PASSWORD: "{{ .Values.postgres.auth.password }}"
  DB_NAME: "{{ .Values.postgres.auth.database }}"
  JWT_ACCESS_SECRET: "CHANGE_ME_MIN_32_CHARS"
  JWT_REFRESH_SECRET: "CHANGE_ME_MIN_32_CHARS"
  MFA_ENCRYPTION_KEY: "CHANGE_ME_MIN_32_CHARS"
  REDIS_URL: "redis://{{ .Values.redis.host | default "redis" }}:6379"
  CORS_ORIGIN: "https://{{ .Values.ingress.host }}"
  APP_DISPLAY_NAME: "{{ .Values.brand.appDisplayName }}"
  MFA_ISSUER: "{{ .Values.brand.mfaIssuer }}"
  # Optional — override before production deploy
  # SENTRY_DSN: ""
{{- end }}
